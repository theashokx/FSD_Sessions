<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DashBoard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container-fluid-p0">
      <h1 class="text-center fs-1 f-bold bg-primary shadow">DashBoard</h1>
      <div class="container mt-4">
        <div class="row g-4">
          <div class="col-md-4">
            <div class="card shadow border-0 h-100">
              <div class="card-body text-center">
                <img
                  src="Images/totalStudents.png"
                  alt="Total Students"
                  style="height: 80px; object-fit: contain"
                />
                <h5 class="card-title mt-3">Total Students</h5>
                <h1 class="fw-bold text-primary">1,500</h1>
              </div>
            </div>
          </div>

          <div class="col-md-4">
            <div class="card shadow border-0 h-100">
              <div class="card-body text-center">
                <img
                  src="Images/Present.png"
                  alt="Present Students"
                  style="height: 80px; object-fit: contain"
                />
                <h5 class="card-title mt-3">Present Students</h5>
                <h1 class="fw-bold text-success">1,200</h1>
              </div>
            </div>
          </div>

          <div class="col-md-4">
            <div class="card shadow border-0 h-100">
              <div class="card-body text-center">
                <img
                  src="Images/Absent.png"
                  alt="Absent Students"
                  style="height: 80px; object-fit: contain"
                />
                <h5 class="card-title mt-3">Absent Students</h5>
                <h1 class="fw-bold text-danger">300</h1>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
