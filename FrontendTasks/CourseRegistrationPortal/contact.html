<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-6">
          <div class="card shadow border-0 rounded-4">
            <div class="card-body p-4">
              <h2 class="text-center text-primary mb-4">Contact Us</h2>

              <form>
                <div class="mb-3">
                  <label class="form-label">Name</label>
                  <input
                    type="text"
                    class="form-control"
                    placeholder="Enter your name"
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label">Email</label>
                  <input
                    type="email"
                    class="form-control"
                    placeholder="Enter your email"
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label">Message</label>
                  <textarea
                    class="form-control"
                    rows="4"
                    placeholder="Write your message"
                  ></textarea>
                </div>

                <div class="text-center">
                  <button type="submit" class="btn btn-primary px-5">
                    Send Message
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>

      <div class="row mt-5">
        <div class="col-12 text-center mb-4">
          <h2 class="text-primary fw-bold">Our Location</h2>
          <p class="text-muted">Visit our office or contact us anytime.</p>
        </div>
        <div class="col-lg-10 mx-auto mb-4">
          <div class="card shadow border-0 rounded-4">
            <div class="card-body text-center p-4">
              <h4 class="text-primary mb-3">📍 Address</h4>

              <p class="mb-1">
                <strong>Vastunagar</strong>
              </p>

              <p class="mb-1">Mangalpalli Village</p>

              <p class="mb-1">Ibrahimpatnam Mandal</p>

              <p class="mb-1">Rangareddy District</p>

              <p class="mb-1">Telangana - 501510</p>

              <p class="mb-0">India</p>
            </div>
          </div>
        </div>

        <div class="col-lg-10 mx-auto">
          <div class="card shadow border-0 rounded-4 overflow-hidden">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d7622.921000290794!2d78.59790970000003!3d17.196435599999997!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sin!4v1780987913275!5m2!1sen!2sin"
              width="100%"
              height="450"
              style="border: 0"
              allowfullscreen=""
              loading="lazy"
            >
            </iframe>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
